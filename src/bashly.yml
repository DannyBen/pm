name: pm
help: A friendly interface for pacman
version: 0.1.2

dependencies:
  pacman: pm requires pacman and is intended for Arch Linux

commands:
- name: update
  alias: u
  help: Update package databases and upgrade the system
  group: Package Management
  flags:
  - long: --yes
    short: -y
    help: Skip the confirmation prompt

- name: install
  alias: [add, i]
  help: Install packages
  group: Package Management
  args:
  - name: package
    help: Package name
    required: true
    repeatable: true
    completions: [$(pm list --available)]
  examples:
  - pm install git
  - pm install git fzf

- name: uninstall
  alias: [remove, rm]
  help: Remove packages and their unneeded dependencies
  group: Package Management
  args:
  - name: package
    help: Package name
    required: true
    repeatable: true
    completions: [$(pm list)]
  examples:
  - pm uninstall git

- name: update-keys
  alias: keys
  help: Update the Arch Linux keyring
  group: Package Maintenance

- name: clean
  help: Remove old packages from the package cache
  group: Package Maintenance
  dependencies:
    paccache: Install with $(magenta pm install pacman-contrib)
  flags:
  - long: --keep
    short: -k
    arg: count
    help: Number of package versions to keep (default 3)
  - long: --dry-run
    short: -d
    help: Show packages that would be removed
  examples:
  - pm clean
  - pm clean --keep 2
  - pm clean --dry-run

- name: outdated
  help: List installed packages with available updates
  group: Package Maintenance
  dependencies:
    checkupdates: Install with $(magenta pm install pacman-contrib)
    fakeroot: Install with $(magenta pm install fakeroot)

- name: list
  alias: ls
  help: List package names
  group: Package Query
  flags:
  - long: --available
    short: -a
    help: List available repository packages instead of installed packages

- name: info
  alias: show
  help: Show package information
  group: Package Query
  args:
  - name: package
    help: Package name
    required: true
    repeatable: true
    completions:
    - $(if _pm_completions_option_seen --available -a; then pm list --available; else pm list; fi)
  flags:
  - long: --available
    short: -a
    help: Query available repository packages instead of installed packages
  examples:
  - pm info git
  - pm info git --available

- name: search
  alias: find
  help: Search packages
  group: Package Query
  args:
  - name: query
    help: Search expression
    required: true
    repeatable: true
  flags:
  - long: --available
    short: -a
    help: Search available repository packages instead of installed packages
  examples:
  - pm search terminal emulator
  - pm search terminal emulator --available

- name: browse
  help: Browse packages interactively
  group: Package Query
  dependencies:
    fzf: Install with $(magenta pm install fzf)
  flags:
  - long: --available
    short: -a
    help: Browse available repository packages instead of installed packages

- name: provides
  help: Find packages that provide a command
  group: Package Analysis
  dependencies:
    pkgfile: Install with $(magenta pm install pkgfile)
  args:
  - name: command
    help: Command name
    required: true
  examples:
  - pm provides convert

- name: tree
  help: Show a package dependency tree
  group: Package Analysis
  dependencies:
    pactree: Install with $(magenta pm install pacman-contrib)
  args:
  - name: package
    help: Package name
    required: true
    completions:
    - $(if _pm_completions_option_seen --available -a; then pm list --available; else pm list; fi)
  flags:
  - long: --available
    short: -a
    help: Query available repository packages instead of installed packages
  - long: --reverse
    short: -r
    help: Show packages that depend on this package
  examples:
  - pm tree git
  - pm tree git --available
  - pm tree git --reverse

- name: origin
  help: Show which installed package owns a file
  group: Package Analysis
  args:
  - name: path
    help: File path
    required: true
    repeatable: true
    completions: [<file>]
  examples:
  - pm origin /usr/bin/git

- name: history
  alias: log
  help: Show package activity from the pacman log
  group: Package Analysis
  dependencies:
    rg: Install with $(magenta pm install ripgrep)
    pacman-conf: Install with $(magenta pm install pacman)
  args:
  - name: package
    help: Package name
    completions: [$(pm list)]
  flags:
  - long: --context
    short: -c
    arg: lines
    help: Number of lines to show around each match (default 10)
  examples:
  - pm history
  - pm history mdcat
  - pm history mdcat --context 5

- name: foreign
  help: List installed packages absent from configured repositories
  group: Package Analysis

- name: repos
  help: List configured package repositories
  group: Package Analysis
  dependencies:
    pacman-conf: Install with $(magenta pm install pacman)

- name: completions
  help: Generate bash completions
  group: Internal
